:root{
  --ink:#0C2B33;
  --brand:#0B6F78;
  --brand-press:#095A62;
  --porcelain:#F3F7F7;
  --sheet:#FFFFFF;
  --line:#D5E3E4;
  --tile:#E3F1F2;
  --muted:#4D6970;
  --open:#46E2A0;
  --closed:#F5B94A;
  --smile:84px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --text:"DM Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--porcelain);color:var(--ink);
  font-family:var(--text);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
svg{display:block}

.page{
  max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--porcelain);
  display:flex;flex-direction:column;
}

/* Cabecera: el borde inferior es una sonrisa */
.head{
  background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top) + 26px) 24px 56px;
  border-radius:0 0 50% 50% / 0 0 var(--smile) var(--smile);
  animation:sonrisa .9s cubic-bezier(.2,.7,.2,1) .15s both;
}
@keyframes sonrisa{
  from{border-radius:0 0 50% 50% / 0 0 0 0}
  to{border-radius:0 0 50% 50% / 0 0 var(--smile) var(--smile)}
}
.status{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 13px 7px 11px;border-radius:999px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  font-size:14px;line-height:1.2;color:#EAF6F7;
}
.status[hidden]{display:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--open);flex:none}
.status.cerrado .dot{background:var(--closed)}
.name{
  margin:22px 0 0;
  font-family:var(--display);font-weight:700;font-stretch:125%;
  font-size:clamp(38px,11.6vw,52px);line-height:1;letter-spacing:-.012em;
}
.tag{margin:10px 0 0;font-size:17px;color:#C9DEE1}

main{padding:0 20px;margin-top:-18px;position:relative}

/* Acción principal */
.main-cta{
  display:grid;grid-template-columns:52px 1fr;align-items:center;gap:16px;
  min-height:92px;padding:16px 20px;border-radius:22px;
  background:var(--brand);color:#fff;
  box-shadow:0 14px 26px -14px rgba(11,111,120,.75),inset 0 1px 0 rgba(255,255,255,.18);
  transition:background-color .15s,transform .15s;
}
.main-cta:hover{background:var(--brand-press)}
.main-cta:active{transform:scale(.985);background:var(--brand-press)}
.main-cta .ico{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.16);display:grid;place-items:center;
}
.main-cta .lbl{font-family:var(--display);font-weight:650;font-size:25px;line-height:1.1;letter-spacing:-.005em}
.main-cta .sub{display:block;margin-top:4px;font-size:15px;color:#E7F6F7;text-wrap:balance}

/* Resto de acciones: una sola lista */
.list{
  margin:16px 0 0;padding:0;list-style:none;
  background:var(--sheet);border:1px solid var(--line);border-radius:22px;overflow:hidden;
}
.list li + li{border-top:1px solid var(--line)}
.row{
  display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:14px;
  min-height:78px;padding:14px 16px 14px 16px;
  transition:background-color .15s;
}
.row:hover,.row:active{background:#F0F7F7}
.row .ico{width:44px;height:44px;border-radius:14px;background:var(--tile);color:var(--brand);display:grid;place-items:center}
.row .lbl{display:block;font-family:var(--display);font-weight:650;font-size:19px;line-height:1.15}
.row .sub{display:block;margin-top:2px;font-size:14.5px;color:var(--muted);text-wrap:balance}
.row .go{color:#7F9AA0}

a:focus-visible{outline:3px solid #1AA6B3;outline-offset:3px}
.nexia:focus-visible{outline-offset:4px}
.main-cta:focus-visible{outline-color:var(--ink)}
.row:focus-visible{outline-offset:-3px}

/* Horario */
.hours{margin:28px 4px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14.5px;color:var(--muted)}
.hours dt{font-weight:600;color:var(--ink)}
.hours dd{margin:0;font-variant-numeric:tabular-nums}

footer{
  margin-top:auto;padding:28px 24px calc(env(safe-area-inset-bottom) + 24px);
}
.firma{display:flex;align-items:center;justify-content:center;gap:9px}
.cliente{display:block;color:#DABEA5;line-height:0}
.logo-cliente{display:block;width:74px;height:auto}
.by{font-size:12.5px;color:#7F949A}
.nexia{display:flex;align-items:center;gap:5px;border-radius:6px}
.nexia .nx{font-family:var(--display);font-weight:800;font-size:14.5px;letter-spacing:.02em;line-height:1;color:#10172A}
.esfera{
  display:block;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#FFFFFF 0%,#A9C2FF 28%,#3F63F5 62%,#1A2F9A 100%);
}
.nexia:hover .nx{color:#007EC2}

noscript .nojs{display:block;margin:16px 20px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}

@media (min-width:520px){
  body{background:#DCE8E9}
  .page{margin:28px auto;min-height:0;border-radius:34px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(12,43,51,.45)}
  footer{padding-bottom:28px}
}
@media (prefers-reduced-motion:reduce){
  .head{animation:none}
  .main-cta,.row{transition:none}
}
</style>
</head>

<script>
/* ============================================================
   DATOS DEL CLIENTE: es lo único que cambia entre una página y otra
   ============================================================ */
const CLIENTE = {
  nombre: "Dental Up",
  subtitulo: "Clínica dental en Albacete",
  telefono: "+34967211323",
  telefonoVisible: "967 21 13 23",
  whatsapp: "34673173183",
  mensajeCita: "Hola, quisiera pedir cita en Clínica Dental UP.",
  direccion: "C/ Caba, 7",
  mapsUrl: "https://maps.app.goo.gl/AqNXLiNu27Mdbrwh6",
  // Abre directamente el formulario de reseña de Google de la clínica
  // (identificador de Google del negocio en C/ Caba, 7).
  resenaUrl: "https://search.google.com/local/writereview?placeid=ChIJTROy-b9fZg0RDvl44z7z5No",
  // 0 = domingo ... 6 = sábado. Tramos [abre, cierra] en hora de Madrid.
  horario: {
    0: [], 6: [],
    1: [["09:30","14:00"],["15:30","19:30"]],
    2: [["09:30","14:00"],["15:30","19:30"]],
    3: [["09:30","14:00"],["15:30","19:30"]],
    4: [["09:30","14:00"],["15:30","19:30"]],
    5: [["09:30","15:00"]]
  },
  horarioTexto: [
    ["Lunes a jueves", "9:30–14:00 y 15:30–19:30"],
    ["Viernes", "9:30–15:00"]
  ]
};

/* ---------- Iconos (trazo) ---------- */
const I = {
  cita:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3.2v3.6M16 3.2v3.6"/><path d="m9.2 15.2 2 2 3.8-4"/></svg>',
  tel:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.2 3.8h3.3l1.6 4-2 1.3a11 11 0 0 0 5.8 5.8l1.3-2 4 1.6v3.3a2 2 0 0 1-2.1 2A15.8 15.8 0 0 1 3.2 5.9a2 2 0 0 1 2-2.1Z"/></svg>',
  pin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>',
  star:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.8l5.9-.8L12 3.6Z"/></svg>',
  go:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg>'
};

/* ---------- Estado abierto / cerrado (hora de Madrid, sin guardar nada) ---------- */
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const WK = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
const aMin = h => { const [a,b] = h.split(":").map(Number); return a*60+b; };
const fmt = h => { const [a,b] = h.split(":"); return Number(a)+":"+b; };

function ahoraMadrid(){
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Madrid",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { dia: WK[g("weekday")], min: Number(g("hour"))*60 + Number(g("minute")) };
}

function estado(){
  const {dia, min} = ahoraMadrid();
  const hoy = CLIENTE.horario[dia] || [];
  for (const [a,c] of hoy){
    if (min >= aMin(a) && min < aMin(c)) return {abierto:true, texto:"Abierto ahora, cierra a las " + fmt(c)};
  }
  for (const [a] of hoy){
    if (min < aMin(a)) return {abierto:false, texto:"Cerrado ahora, abre hoy a las " + fmt(a)};
  }
  for (let d = 1; d <= 7; d++){
    const i = (dia + d) % 7, t = CLIENTE.horario[i] || [];
    if (t.length) return {abierto:false, texto:"Cerrado ahora, abre " + (d === 1 ? "mañana" : "el " + DIAS[i]) + " a las " + fmt(t[0][0])};
  }
  return {abierto:false, texto:"Cerrado ahora"};
}

/* ---------- Pintar la página ---------- */
(function(){
  const C = CLIENTE;
  let est = null;
  try { est = estado(); } catch(e) {}

  document.getElementById("nombre").textContent = C.nombre;
  document.getElementById("subtitulo").textContent = C.subtitulo;

  if (est){
    const s = document.getElementById("status");
    document.getElementById("status-text").textContent = est.texto;
    s.classList.toggle("cerrado", !est.abierto);
    s.hidden = false;
  }

  const wa = "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(C.mensajeCita);
  const cta = document.getElementById("cta");
  cta.href = wa; cta.target = "_blank"; cta.rel = "noopener";
  cta.innerHTML =
    '<span class="ico">' + I.cita + '</span>' +
    '<span><span class="lbl">Reservar cita</span>' +
    '<span class="sub">' + (est && !est.abierto ? "Escríbenos, te contestamos al abrir" : "Te contestamos por WhatsApp") + '</span></span>';

  const filas = [
    {href:"tel:" + C.telefono, icon:I.tel, lbl:"Llamar", sub:C.telefonoVisible},
    {href:C.mapsUrl, icon:I.pin, lbl:"Cómo llegar", sub:C.direccion + ". Aparca gratis en Villacerrada.", ext:true},
    {href:C.resenaUrl, icon:I.star, lbl:"Dejar una reseña", sub:"Cuéntanos cómo fue tu visita", ext:true}
  ];
  document.getElementById("lista").innerHTML = filas.map(f =>
    '<li><a class="row" href="' + f.href + '"' + (f.ext ? ' target="_blank" rel="noopener"' : '') + '>' +
    '<span class="ico">' + f.icon + '</span>' +
    '<span><span class="lbl">' + f.lbl + '</span><span class="sub">' + f.sub + '</span></span>' +
    '<span class="go">' + I.go + '</span></a></li>'
  ).join("");

  document.getElementById("horario").innerHTML = C.horarioTexto.map(h =>
    '<dt>' + h[0] + '</dt><dd>' + h[1] + '</dd>'
  ).join("");
})();
</script>
