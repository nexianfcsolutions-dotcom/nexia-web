<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0E10">
<title>Restaurante Azabache · Albacete</title>
<meta name="description" content="Carta, reservas, teléfono y cómo llegar al Restaurante Azabache, en Albacete.">
<!-- Lanzadera de muestra preparada por NEXIA para el Restaurante Azabache (Albacete).
     Enlaces tomados de su web azabachealbacete.com (carta, reservas, Instagram). Pendiente: su logo en archivo y su aprobación. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concepto: lanzadera de una pantalla para mesa de restaurante. La carta es el protagonismo; debajo, tres acciones:
   reservar llamando, cómo llegar y opinión en Google. Paleta provisional (negro azabache, crema, cobre) hasta recibir su marca. */
:root{
  --bg:#0E0E10;
  --card:#17171A;
  --line:#2C2C31;
  --cream:#F3EBDD;
  --muted:#A8A196;
  --copper:#C98B5B;
  --copper-soft:#E2B48C;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--cream);
  font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(201,139,91,.16),transparent 60%);
  background-repeat:no-repeat;
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
}
.wrap{max-width:460px;margin-inline:auto;display:grid;gap:16px}
:focus-visible{outline:3px solid var(--copper-soft);outline-offset:3px}

.brand{text-align:center;padding:10px 0 4px}
.brand .name{font:600 clamp(40px,12vw,54px)/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--cream)}
.brand .rule{width:56px;height:2px;margin:14px auto 12px;background:var(--copper);border-radius:2px}
.brand .sub{margin:0;color:var(--muted);font-size:14px;letter-spacing:.18em;text-transform:uppercase}

/* Carta: bloque principal */
.menu{
  display:block;text-decoration:none;color:var(--bg);
  background:linear-gradient(135deg,var(--copper-soft),var(--copper));
  border-radius:18px;padding:26px 22px;
  box-shadow:0 14px 30px -14px rgba(201,139,91,.65);
  transition:transform .15s ease,box-shadow .15s ease;
}
.menu:hover{transform:translateY(-2px)}
.menu:active{transform:scale(.99)}
.menu .top{display:flex;align-items:center;gap:16px}
.menu .ico{flex:none;width:58px;height:58px;border-radius:50%;background:rgba(14,14,16,.12);display:grid;place-items:center}
.menu .ico svg{width:30px;height:30px}
.menu h2{font:700 clamp(30px,9vw,38px)/1 var(--f-display);margin:0}
.menu p{margin:12px 0 0;font-size:15px;font-weight:500}

.actions{display:grid;gap:12px}
.action{
  display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--cream);
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-height:76px;
  transition:border-color .15s ease,transform .15s ease;
}
.action:hover{border-color:var(--copper)}
.action:active{transform:scale(.99)}
.action .ico{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(201,139,91,.14);display:grid;place-items:center}
.action .ico svg{width:23px;height:23px}
.action b{display:block;font:600 17px/1.2 var(--f-body)}
.action .sub{display:block;margin-top:2px;font-size:13.5px;color:var(--muted)}
.action .arrow{margin-left:auto;flex:none;width:18px;height:18px;color:var(--muted)}

.hours{margin:0;text-align:center;font-size:14px}
.hours a{color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.hours a:hover{color:var(--copper-soft)}

/* Firma: nombre del cliente, "by", isotipo NEXIA */
.sign{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font:500 12px var(--f-body)}
.sign .cl{font:600 14px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sign .nx-logo{display:block;height:14px;width:auto;opacity:.8}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap>*{animation:up .5s ease-out both}
.wrap>*:nth-child(2){animation-delay:.05s}.wrap>*:nth-child(3){animation-delay:.1s}.wrap>*:nth-child(4){animation-delay:.16s}.wrap>*:nth-child(5){animation-delay:.22s}.wrap>*:nth-child(6){animation-delay:.28s}
@media (prefers-reduced-motion:reduce){.wrap>*{animation:none}.menu,.action{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <h1 class="name">Azabache</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="sub">Restaurante · Albacete</p>
  </header>

  <a class="menu" id="carta" href="https://www.azabachealbacete.com/carta/">
    <div class="top">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 34 34" fill="none" stroke="#0E0E10" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8c-2.6-2-6.2-2.6-10-2.2v19.6c3.8-.4 7.4.2 10 2.2 2.6-2 6.2-2.6 10-2.2V5.8c-3.8-.4-7.4.2-10 2.2z"/><path d="M17 8v19.6"/></svg>
      </span>
      <h2>Ver la carta</h2>
    </div>
    <p>Pizzas, pastas, arroces, carnes, pescados y postres.</p>

      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E2B48C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </span>
      <span><b>Reservar mesa</b><span class="sub">Reserva online en su web</span></span>
      <svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
    </a>
    <a class="action" href="tel:+34967191060">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E2B48C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      </span>
      <span><b>Llamar</b><span class="sub">967 19 10 60</span></span>
      <svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
    </a>
    <a class="action" href="https://www.google.com/maps/search/?api=1&query=Restaurante%20Azabache%20Albacete&query_place_id=ChIJ9ZYea7lfZg0Rqkh-htp2Fdo">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E2B48C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      </span>
      <span><b>Cómo llegar</b><span class="sub">Calle Iris, 42</span></span>
      <svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
    </a>
    <a class="action" href="https://search.google.com/local/writereview?placeid=ChIJ9ZYea7lfZg0Rqkh-htp2Fdo">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 26 26" fill="none" stroke="#E2B48C" stroke-width="2" stroke-linejoin="round"><path d="M13 3.8l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L13 17.6l-5.4 3 1.1-6.1-4.5-4.3 6.1-.8z"/></svg>
      </span>
      <span><b>Déjanos tu opinión</b><span class="sub">Cuéntanos qué tal en Google</span></span>
      <svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
    </a>
  </nav>

  <p class="hours"><a href="https://www.instagram.com/azabachealbacete/">Síguenos en Instagram · @azabachealbacete</a></p>

  <footer class="sign">
    <span class="cl">Azabache</span>
    <span>by</span>
    <svg class="nx-logo" viewBox="74 -2 4375 972" role="img" aria-label="NEXIA" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="nx-g" gradientUnits="userSpaceOnUse" x1="74" y1="0" x2="4449" y2="0"><stop offset="0" stop-color="#F3EBDD"/><stop offset=".4" stop-color="#F3EBDD"/><stop offset=".52" stop-color="#C9D6FF"/><stop offset=".7" stop-color="#9DB5FF"/><stop offset="1" stop-color="#7C9CFF"/></linearGradient><linearGradient id="nx-r" gradientUnits="userSpaceOnUse" x1="1612" y1="0" x2="2912" y2="0"><stop offset="0" stop-color="#12C6CC"/><stop offset=".55" stop-color="#0A7FC4"/><stop offset="1" stop-color="#7C82DE"/></linearGradient></defs><path fill="url(#nx-g)" d="M74 686V-2H289L629 285Q635 290 646 300Q657 310 669 321Q681 332 691 341H701Q701 327 701 303.5Q701 280 701 258V-2H933V686H720L397 415Q376 398 352.5 377Q329 356 315 343H306Q306 357 306 382.5Q306 408 306 434V686ZM1151 686V-2H1886V169H1399V258H1819V420H1399V515H1894V686ZM2019 686 2347 331 2049 -2H2368L2503 161H2511L2655 -2H2947L2647 321L2974 686H2656L2492 492H2483L2313 686ZM3112 686V-2H3359V686ZM3511 686 3844 -2H4116L4449 686H4184L4143 595H3806L3766 686ZM3881 424H4068L4020 308Q4017 300 4012 286.5Q4007 273 4001 256Q3995 239 3989.5 222Q3984 205 3979 191H3972Q3966 208 3958 230Q3950 252 3942.5 273Q3935 294 3929 308Z"/><rect x="1612" y="876" width="1300" height="94" rx="47" fill="url(#nx-r)"/></svg>

</main>

</body>
</html>
